name: 'AI Code Review'
description: 'Bounded, comment-only AI feedback on pull requests using Gemini and a provider-neutral interface'
author: 'AI Code Review Contributors'
branding:
  icon: 'code'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token with pull-requests:write and issues:write permissions'
    required: false
    default: '${{ github.token }}'
  provider:
    description: 'AI provider name (gemini, openai, anthropic, ollama; fake for testing)'
    required: false
    default: 'gemini'
  model:
    description: 'Explicit model identifier for the selected provider. Can also be configured via GitHub variable or environment variable (AI_MODEL, MODEL, GEMINI_MODEL).'
    required: false
    default: ''
  provider-api-key:
    description: 'API key for the external AI provider'
    required: false
    default: ''
  provider-base-url:
    description: 'Ollama server origin; remote origins require HTTPS and external opt-in'
    required: false
    default: 'http://127.0.0.1:11434'
  allow-external-provider:
    description: 'Explicit opt-in to send selected diff, instructions and bounded related source to the external provider'
    required: false
    default: 'false'
  max-files:
    description: 'Maximum number of files to review'
    required: false
    default: '20'
  max-file-bytes:
    description: 'Maximum patch size in bytes per file (UTF-8)'
    required: false
    default: '20480'
  max-input-bytes:
    description: 'Maximum total serialized input bytes to provider'
    required: false
    default: '81920'
  max-input-tokens:
    description: 'Estimated input tokens ceiling guard'
    required: false
    default: '12000'
  max-output-tokens:
    description: 'Provider output token cap'
    required: false
    default: '2000'
  max-requests:
    description: 'Maximum provider requests per run (default 1; explicitly set 2 for one configured fallback)'
    required: false
    default: '1'
  max-findings:
    description: 'Maximum inline findings to publish per run'
    required: false
    default: '5'
  review-language:
    description: 'Natural language for review feedback'
    required: false
    default: 'English'
  exclude-patterns:
    description: 'Additional glob patterns to exclude from review (newline or comma-separated)'
    required: false
    default: ''
  mode:
    description: 'Review mode (only "comment" accepted)'
    required: false
    default: 'comment'
  static-report-paths:
    description: 'Explicit paths to SHA-wrapped local static tool reports (no globs) (newline or comma-separated)'
    required: false
    default: ''
  fail-on-error:
    description: 'Fail the GitHub Actions step for any failed or partial review, including configuration, validation and publication errors'
    required: false
    default: 'false'
  thinking-level:
    description: 'Thinking / reasoning effort level for supported models: minimal, low, medium, high (default: low)'
    required: false
    default: 'low'
  custom-instructions:
    description: 'Custom review guidelines, rules, or instructions. Can be inline text, or one or multiple file paths in the project (newline or comma-separated, e.g. docs/rules.md, standards/security.md). Defaults to .github/ai-review.md if that file exists in the repository.'
    required: false
    default: ''
  fallback-model:
    description: 'Optional fallback model on HTTP 429/503; requires max-requests: 2'
    required: false
    default: ''

  incremental:
    description: 'Skip unchanged file patches from successful reviews; manual commands force review'
    default: 'true'
  max-context-bytes:
    description: 'Total optional relative-import source bytes (0 disables; maximum 8192)'
    default: '2048'
  min-severity:
    description: 'Minimum published severity: critical, high, medium, low'
    default: 'medium'
  require-evidence:
    description: 'Require an exact added-source-line quote supporting every finding'
    default: 'true'

outputs:
  status:
    description: 'Review outcome status: completed, partial, skipped, or failed'
  reason-code:
    description: 'Machine-readable reason code for skips, partial reviews, or failures'
  reviewed-files:
    description: 'Number of eligible files sent for review'
  published-findings:
    description: 'Number of inline comments successfully published'
  input-tokens:
    description: 'Estimated or actual input token count'
  output-tokens:
    description: 'Actual or estimated output token count'

runs:
  using: 'node24'
  main: 'dist/index.js'
